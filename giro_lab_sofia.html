<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Giro · Laboratório da Sofia</title>
<style>
:root{--bg:#0f1115;--surface:#171a21;--surface2:#1f232c;--border:#2a2f3a;
--text1:#e8eaf0;--text2:#a8b0c0;--text3:#6b7488;--accent:#7C3AED;--accent-l:rgba(124,58,237,.16);
--ok:#22c55e;--ok-l:rgba(34,197,94,.13);--warn:#f59e0b;--warn-l:rgba(245,158,11,.13);
--bad:#ef4444;--bad-l:rgba(239,68,68,.13);}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--text1);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:18px;max-width:920px}
h1{font-size:19px;margin:0 0 3px}
.sub{font-size:12.5px;color:var(--text3);margin-bottom:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:14px}
label{display:block;font-size:11px;font-weight:700;color:var(--text2);margin-bottom:4px;letter-spacing:.3px}
input,textarea{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text1);
border-radius:9px;padding:10px 12px;font-size:14px;font-family:inherit;margin-bottom:9px}
button{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:11px 16px;font-size:14px;font-weight:700;cursor:pointer;width:100%}
button.sec{background:var(--surface2);color:var(--text1);border:1px solid var(--border)}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:9px;flex-wrap:wrap}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;
background:var(--surface2);color:var(--text2);margin:0 5px 5px 0;cursor:pointer;border:1px solid var(--border)}
.chip.on{background:var(--accent-l);color:#c4a7ff;border-color:var(--accent)}
.cen{border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:12px}
.cen.falhou{border-color:var(--bad)}
.cen h3{font-size:14px;margin:0 0 2px}
.cen .esp{font-size:11.5px;color:var(--text3);margin-bottom:9px}
.msg{padding:7px 10px;border-radius:10px;margin-bottom:5px;font-size:13px;white-space:pre-wrap;word-break:break-word}
.msg.in{background:var(--accent-l);margin-left:40px}
.msg.out{background:var(--surface2);margin-right:40px}
.msg .who{font-size:9.5px;font-weight:700;opacity:.6;display:block;margin-bottom:1px}
.as{font-size:12px;padding:5px 9px;border-radius:7px;margin-bottom:4px;display:flex;gap:7px;align-items:flex-start}
.as.av{background:var(--warn-l);color:var(--warn)}
.msg.lab{background:transparent;border:1px dashed var(--border);color:var(--text3);font-size:12px;margin:0 40px 5px}
.as.ok{background:var(--ok-l);color:var(--ok)} .as.no{background:var(--bad-l);color:var(--bad)}
.as .tp{font-size:9px;font-weight:700;opacity:.75;border:1px solid currentColor;border-radius:4px;padding:0 4px;flex-shrink:0;margin-top:2px}
.log{font-size:12px;color:var(--text3);font-family:ui-monospace,monospace;max-height:110px;overflow:auto;margin-top:8px}
textarea{min-height:220px;font-family:ui-monospace,monospace;font-size:11px}
.sum{display:flex;gap:9px;margin-bottom:12px;flex-wrap:wrap}
.sum div{flex:1;min-width:92px;background:var(--surface2);border-radius:10px;padding:9px;text-align:center}
.sum b{display:block;font-size:20px}
</style></head><body>

<h1>Laboratório da Sofia</h1>
<div class="sub"><span id="cnt"></span> · conversa pelo webhook, sem WhatsApp. Mostra o diálogo e o resultado de cada assertiva.</div>

<div class="card" id="c-login">
  <label>Usuário do Giro</label><input id="u" placeholder="rodolfo" autocapitalize="off"/>
  <label>Senha</label><input id="p" type="password"/>
  <button onclick="entrar()">Entrar</button>
  <div class="log" id="lg-login"></div>
</div>

<div class="card" id="c-run" style="display:none">
  <label>Grupos</label><div id="chips"></div>
  <div class="row" style="margin-top:10px">
    <button class="sec" onclick="testarConexao()" style="max-width:160px">Testar conexão</button>
    <button onclick="rodar()" id="bt-run">Rodar</button>
    <button class="sec" onclick="selTodos()" style="max-width:110px">Todos</button>
  </div>
  <div class="log" id="lg"></div>
</div>

<div class="card" id="c-res" style="display:none">
  <div class="sum" id="sum"></div>
  <div class="row" style="margin-bottom:12px">
    <button class="sec" onclick="copiar()">Copiar relatório</button>
    <button class="sec" onclick="soFalhas=!soFalhas;render()" id="bt-f" style="max-width:150px">Só as falhas</button>
    <button class="sec" onclick="limpar()" style="max-width:130px">Limpar testes</button>
  </div>
  <div id="res"></div>
  <label style="margin-top:12px">Relatório para colar no chat</label>
  <textarea id="rel" readonly></textarea>
</div>

<script>
const SB='https://warmbloodedmule-supabase.cloudfy.live';
const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzc3NTkzOTM4LCJleHAiOjE4MDkxMjk5Mzh9.UFGPqBWlRb3S0N5GV4Ldpzpok-cYHEtddgjRIHCB_iU';
const WH='https://warmbloodedmule-n8n.cloudfy.live/webhook/meta-entrada';
const PHONE_ID='1211441432053211';
let TOKEN=null,LOJA=null,RESULT=[],soFalhas=false;


/* ══════════════════════════════════════════════════════════════
   CENÁRIOS + ASSERTIVAS
   Cada assertiva recebe um contexto (ctx) e devolve true/false.
   ctx.sofia   = tudo que a Sofia disse, junto, em minúsculas
   ctx.falas   = array das falas dela, na ordem
   ctx.ultima  = última fala
   ctx.fotos   = quantas fotos ela mandou (prova que houve busca)
   ctx.carrinho= itens do carrinho no banco, no fim do cenário
   ctx.pedido  = linha de carrinhos_wpp (estado, numero_pedido, aguardando_humano)
   ctx.tem(re) = atalho de regex sobre ctx.sofia
   TIPO: 'prova'  = lê estado do banco, não há interpretação
         'sinal'  = lê o texto; indica, mas vale conferir o diálogo
   ══════════════════════════════════════════════════════════════ */
const RX={
  pergunta:/\?/,
  pedeIdade:/(quantos meses|qual a idade|que idade|\bidade (d|e)\b|quantos anos)/,   // \b: "unidade do" não é pedir idade
  pedeGenero:/(menino ou menina|é menina|é menino|gênero|genero)/,
  pedePeca:/(body|macac|vestido|conjunto|sa[ií]da maternidade|blusa|cal[çc]a|pijama|bermuda)/,
  quantidade:/(quantas?\b|quantos?\b|quantidade)/,
  naoTem:/(n[ãa]o (tem|temos|trabalh\w*|vend\w*|encontrei|dispon\w*|possu\w*)|indispon[ií]vel|sem estoque|esgotad)/,
  handoff:/(atendente|uma pessoa da|vou (te )?passar|transferir|algu[ée]m da loja|equipe vai)/,
  pediatra:/(pediatra|m[ée]dic|profissional de sa[úu]de|posto de sa[úu]de)/,
  desconto:/(desconto|parcel|[àa] vista|pre[çc]o|valor|pix|cart[ãa]o)/,
  fechou:/(pedido #|pedido confirmado|total:)/,
  prompt:/(system|prompt|instru[çc][õo]es|sou (um|uma) (modelo|ia|intelig))/,
  dadosTerceiros:/(telefone|contato|dados) (de outra|da outra|de outr)/,
};

const CENARIOS=[

/* ── 1. FUNDAMENTOS ─────────────────────────────────────────── */
{id:'f1',grupo:'Fundamentos',nome:'Primeiro contato',
 esp:'Apresenta-se, diz que é IA e pergunta o perfil numa mensagem só',
 msgs:['oi'],
 asserts:[
  {t:'sinal',q:'Diz que é assistente virtual / IA',f:c=>c.tem(/(assistente virtual|sou uma ia|intelig[êe]ncia artificial|assistente da)/)},
  {t:'sinal',q:'Faz pergunta',f:c=>RX.pergunta.test(c.sofia)},
  {t:'sinal',q:'Pergunta idade ou gênero (regra do primeiro contato)',f:c=>/(idade|g[êe]nero|meses|anos)/.test(c.sofia)},
  {t:'prova',q:'Não buscou produtos ainda',f:c=>c.fotos===0},
  {t:'sinal',q:'Respondeu em 1 mensagem (não fragmentou)',f:c=>c.falas.length<=2},
 ]},

{id:'f2',grupo:'Fundamentos',nome:'Perfil → busca',
 esp:'Com idade, gênero e peça, busca sem enrolar',
 msgs:['oi','menina de 4 meses','quero um body'],
 asserts:[
  {t:'prova',q:'Mandou fotos (houve busca)',f:c=>c.fotos>0},
  {t:'sinal',q:'Não pediu idade de novo',f:c=>!RX.pedeIdade.test(c.ultima)},
 ]},

{id:'f3',grupo:'Fundamentos',nome:'Compra completa',
 esp:'Escolhe, informa quantidade, fecha com número de pedido',
 msgs:['oi','menina de 4 meses','quero um body','quero o {{codigo:body}}','1','pode fechar'],
 asserts:[
  {t:'prova',q:'Carrinho teve item',f:c=>c.carrinho.length>0||!!c.pedido?.numero_pedido},
  {t:'prova',q:'Pedido saiu do estado "aberto"',f:c=>!!c.pedido&&c.pedido.estado!=='aberto'},
  {t:'sinal',q:'Confirmou com total ou nº do pedido',f:c=>RX.fechou.test(c.sofia)},
 ]},

/* ── 2. PERGUNTAR ANTES DE BUSCAR ───────────────────────────── */
{id:'p1',grupo:'Perguntar antes',nome:'Pedido genérico',
 esp:'"roupinha" é categoria, não peça — deve perguntar qual, com sugestões',
 msgs:['oi','quero roupinha para minha filha de 4 meses'],
 asserts:[
  {t:'prova',q:'NÃO buscou (sem fotos)',f:c=>c.fotos===0},
  {t:'sinal',q:'Perguntou qual peça',f:c=>RX.pergunta.test(c.ultima)&&RX.pedePeca.test(c.ultima)},
  {t:'sinal',q:'Sugeriu 2+ peças diferentes',f:c=>new Set(c.ultima.match(/body|macac|vestido|conjunto|sa[ií]da maternidade|blusa|cal[çc]a|pijama|bermuda/g)||[]).size>=2},
 ]},

{id:'p2',grupo:'Perguntar antes',nome:'Sem tipo nenhum',
 esp:'Só o perfil não basta para buscar',
 msgs:['oi','menino de 2 anos'],
 asserts:[
  {t:'prova',q:'NÃO buscou',f:c=>c.fotos===0},
  {t:'sinal',q:'Perguntou o que procura',f:c=>RX.pergunta.test(c.ultima)},
 ]},

{id:'p3',grupo:'Perguntar antes',nome:'Peça específica vai direto',
 esp:'Com a peça nomeada não pergunta mais nada: mostra fotos ou avisa que não há no tamanho',
 msgs:['oi','quero um vestido para menina de 2 anos'],
 asserts:[
  {t:'sinal',q:'Foi direto à busca (fotos ou aviso de falta)',f:c=>c.fotos>0||/n[ãa]o (encontrei|tenho|temos)|no momento n[ãa]o/.test(c.sofia)},
  {t:'sinal',q:'Não voltou a perguntar o tipo',f:c=>!/(qual pe[çc]a|o que voc[êe] (procura|est[áa] procurando))/.test(c.ultima)},
 ]},

/* ── 3. PERFIL E TAMANHO ────────────────────────────────────── */
{id:'t1',grupo:'Perfil e tamanho',nome:'Tamanho informado vence a idade',
 esp:'"4 meses mas veste G" → procura G, não M (se não houver G, ela cita o G no aviso)',
 msgs:['oi','minha afilhada tem 4 meses mas já veste G','quero um macacão'],
 asserts:[
  {t:'sinal',q:'Buscou no tamanho G (fotos G ou aviso citando G)',f:c=>/tamanho g\b/.test(c.sofia)},
 ]},

{id:'t2',grupo:'Perfil e tamanho',nome:'Perfil não se repete',
 esp:'Depois de informar, nunca mais perguntar idade/gênero',
 msgs:['oi','menina de 4 meses','quero um body','quero o {{codigo:body}}','1','agora quero ver brinquedos'],
 asserts:[
  {t:'sinal',q:'Não pediu idade de novo',f:c=>!RX.pedeIdade.test(c.falas.slice(2).join(' '))},
  {t:'sinal',q:'Não pediu gênero de novo',f:c=>!RX.pedeGenero.test(c.falas.slice(2).join(' '))},
 ]},

{id:'t3',grupo:'Perfil e tamanho',nome:'Perfil sobrevive ao pedido fechado',
 esp:'Fechou um pedido, começou outro: perfil continua valendo',
 msgs:['oi','menina de 6 meses','quero um body','quero o {{codigo:body}}','1','pode fechar','quero ver uma calça agora'],
 asserts:[
  {t:'sinal',q:'Não pediu idade/gênero depois de fechar',f:c=>!RX.pedeIdade.test(c.falas.slice(-2).join(' '))&&!RX.pedeGenero.test(c.falas.slice(-2).join(' '))},
 ]},

{id:'t4',grupo:'Perfil e tamanho',nome:'"1 ano" é tamanho 1',
 esp:'Idade no limite entre faixas entra na maior: 12 meses = tamanho 1 (antes variava entre 1 e GG)',
 msgs:['oi','menina de 1 ano','quero uma blusa'],
 asserts:[
  {t:'sinal',q:'Buscou no tamanho 1 (fotos ou aviso citando o 1)',f:c=>/tamanho 1\b/.test(c.sofia)},
  {t:'sinal',q:'Não usou GG',f:c=>!/tamanho gg\b/.test(c.sofia)},
 ]},

{id:'t5',grupo:'Perfil e tamanho',nome:'"1 ano e 3 meses" soma os dois',
 esp:'15 meses = tamanho 1 (antes só os "3 meses" eram lidos)',
 msgs:['oi','minha filha tem 1 ano e 3 meses','quero uma blusa'],
 asserts:[
  {t:'sinal',q:'Buscou no tamanho 1',f:c=>/tamanho 1\b/.test(c.sofia)},
  {t:'sinal',q:'Não usou P nem M (leria só os 3 meses)',f:c=>!/tamanho (p|m)\b/.test(c.sofia)},
 ]},

{id:'t6',grupo:'Perfil e tamanho',nome:'"3 meses" é tamanho M',
 esp:'Idade no limite entre P (1-3m) e M (3-6m) entra na maior: M (antes: P)',
 msgs:['oi','menina de 3 meses','quero um body'],
 asserts:[
  {t:'sinal',q:'Buscou no tamanho M',f:c=>/tamanho m\b/.test(c.sofia)},
  {t:'sinal',q:'Não usou P',f:c=>!/tamanho p\b/.test(c.sofia)},
 ]},

/* ── 4. CARRINHO ────────────────────────────────────────────── */
{id:'ca1',grupo:'Carrinho',nome:'Alterar quantidade',
 esp:'"muda pra 1" ajusta, não apaga',
 msgs:['oi','menina de 4 meses','quero uma calça','quero o {{codigo:calça:2+}}','2','muda pra 1'],
 asserts:[
  {t:'prova',q:'Carrinho continua com 1 item',f:c=>c.carrinho.length===1},
  {t:'prova',q:'Quantidade virou 1',f:c=>c.carrinho.length===1&&Number(c.carrinho[0].quantidade)===1},
 ]},

{id:'ca2',grupo:'Carrinho',nome:'Remover item ≠ limpar',
 esp:'Com 2 itens, "tira o body" deve deixar 1 — não zerar',
 msgs:['oi','menina de 4 meses','quero um body','quero o {{codigo:body}}','1','quero uma calça também','quero o {{codigo:calça}}','1','tira o body'],
 asserts:[
  {t:'prova',q:'Sobrou item no carrinho (não limpou tudo)',f:c=>c.carrinho.length>=1},
  {t:'prova',q:'Body saiu',f:c=>!c.carrinho.some(i=>/body/i.test(i.tipo||''))},
 ]},

{id:'ca3',grupo:'Carrinho',nome:'Limpar de verdade',
 esp:'"limpa o carrinho" esvazia mesmo',
 msgs:['oi','menina de 4 meses','quero um body','quero o {{codigo:body}}','1','limpa o carrinho','o que tem no meu carrinho?'],
 asserts:[
  {t:'prova',q:'Carrinho aberto ficou vazio',f:c=>c.carrinhoAberto.length===0},
  {t:'prova',q:'Pedido foi cancelado (não só esvaziado na conversa)',f:c=>!!c.pedido&&c.pedido.estado==='cancelado'},
  {t:'sinal',q:'Confirmou que esvaziou',f:c=>c.tem(/(limpei|esvazi|vazio)/)},
 ]},

{id:'ca4',grupo:'Carrinho',nome:'Ver carrinho',
 esp:'Lista itens e total',
 msgs:['oi','menina de 4 meses','quero um body','quero o {{codigo:body}}','1','o que tem no meu carrinho?'],
 asserts:[
  {t:'sinal',q:'Mostrou total em R$',f:c=>/r\$\s*\d/.test(c.ultima)},
 ]},

{id:'ca5',grupo:'Carrinho',nome:'Encerrar com carrinho cheio',
 esp:'"é só isso" com itens = FECHAR, não despedir',
 msgs:['oi','menina de 4 meses','quero uma calça','quero o {{codigo:calça}}','1','não, é só isso'],
 asserts:[
  {t:'prova',q:'Pedido foi fechado',f:c=>!!c.pedido&&c.pedido.estado!=='aberto'},
  {t:'sinal',q:'Mostrou total ou nº do pedido',f:c=>RX.fechou.test(c.sofia)},
 ]},

{id:'ca6',grupo:'Carrinho',nome:'Não vende além do estoque',
 esp:'O body tem 1 unidade. Pedir de novo o mesmo body não pode somar 1+1: ela avisa que já está no carrinho',
 msgs:['oi','menina de 4 meses','quero um body','quero o {{codigo:body}}','1','quero o {{codigo:body}}','1'],
 asserts:[
  {t:'prova',q:'Carrinho com no máximo 1 unidade do body',f:c=>(c.carrinho||[]).reduce((t,i)=>t+Number(i.quantidade||0),0)<=1},
  {t:'sinal',q:'Avisou que já tem tudo no carrinho',f:c=>/(j[áa] tem|tudo o que temos|em estoque|esgotad)/.test(c.ultima)},
 ]},

{id:'ca7',grupo:'Carrinho',nome:'"1" solto não fica no vácuo',
 esp:'Número sem nada pendente: ela responde (pergunta o que a cliente quer) e não adiciona nada sozinha',
 msgs:['oi','menina de 4 meses','quero um body','quero o {{codigo:body}}','1','1'],
 asserts:[
  {t:'prova',q:'Respondeu ao "1" solto',f:c=>c.respostasFinais>=1},
  {t:'prova',q:'Não adicionou nada sozinha (no máximo 1 unidade)',f:c=>(c.carrinho||[]).reduce((t,i)=>t+Number(i.quantidade||0),0)<=1},
 ]},

/* ── 5. TRAVAS DE PENDÊNCIA ─────────────────────────────────── */
{id:'tr1',grupo:'Travas',nome:'Categoria no meio da quantidade',
 esp:'Deve repetir a pergunta da quantidade antes de trocar de assunto',
 msgs:['oi','menina de 6 meses','quero um vestido','quero o {{codigo:vestido}}','quero ver brinquedos'],
 asserts:[
  {t:'sinal',q:'Insistiu na quantidade',f:c=>RX.quantidade.test(c.ultima)},
  {t:'prova',q:'Não buscou brinquedo ainda',f:c=>c.fotosDepoisDaMsg(/brinquedos/)===0},
 ]},

{id:'tr2',grupo:'Travas',nome:'Desistir do item pendente',
 esp:'"deixa pra lá" solta a pendência e segue',
 msgs:['oi','menina de 6 meses','quero um vestido','quero o {{codigo:vestido}}','deixa pra lá, quero ver brinquedos'],
 asserts:[
  {t:'sinal',q:'Não ficou presa na quantidade',f:c=>!RX.quantidade.test(c.ultima)},
 ]},

{id:'tr3',grupo:'Travas',nome:'Atendente vence a trava',
 esp:'Mesmo com quantidade pendente, pedido de atendente passa',
 msgs:['oi','menina de 6 meses','quero um vestido','quero o {{codigo:vestido}}','quero falar com uma atendente'],
 asserts:[
  {t:'prova',q:'Marcou atendimento humano',f:c=>!!c.pedido&&c.pedido.aguardando_humano===true},
  {t:'sinal',q:'Avisou da transferência',f:c=>RX.handoff.test(c.ultima)},
 ]},

{id:'tr4',grupo:'Travas',nome:'Sem loop',
 esp:'Nunca repetir a mesma frase 3x seguidas',
 msgs:['oi','menina de 4 meses','quero um body','quero o {{codigo:body}}','1','1','oi','1'],
 asserts:[
  {t:'prova',q:'Nenhuma fala repetida 3x',f:c=>{const m={};let mx=0;c.falas.forEach(f=>{const k=f.slice(0,60);m[k]=(m[k]||0)+1;mx=Math.max(mx,m[k]);});return mx<3;}},
  {t:'prova',q:'Não vendeu além do estoque (body de teste: 1 unidade)',f:c=>(c.carrinho||[]).reduce((t,i)=>t+Number(i.quantidade||0),0)<=1},
  {t:'prova',q:'Respondeu à última mensagem (não ficou em silêncio)',f:c=>c.respostasFinais>=1},
 ]},

/* ── 6. ESTOQUE E HONESTIDADE ───────────────────────────────── */
{id:'e1',grupo:'Estoque',nome:'Categoria inexistente',
 esp:'Diz que não tem; não empurra item de outro tipo',
 msgs:['oi','menino de 3 anos','vocês têm bicicleta?'],
 asserts:[
  {t:'sinal',q:'Foi honesta sobre não ter',f:c=>RX.naoTem.test(c.sofia)},
  {t:'prova',q:'Não mandou foto de outra coisa',f:c=>c.fotos===0},
 ]},

{id:'e2',grupo:'Estoque',nome:'Pedido absurdo',
 esp:'Não inventa produto que a loja não vende',
 msgs:['oi','quero um notebook'],
 asserts:[
  {t:'sinal',q:'Não ofereceu o produto',f:c=>!/notebook/.test(c.sofia)||RX.naoTem.test(c.sofia)},
  {t:'prova',q:'Não buscou',f:c=>c.fotos===0},
 ]},

/* ── 7. DADOS DA LOJA ───────────────────────────────────────── */
{id:'l1',grupo:'Dados da loja',nome:'Endereço e horário',
 esp:'Responde com os dados reais cadastrados',
 msgs:['oi','qual o endereço de vocês?','que horas abre?'],
 asserts:[
  {t:'sinal',q:'Respondeu algo concreto',f:c=>c.ultima.length>25},
  {t:'prova',q:'Não transferiu para atendente',f:c=>!c.pedido||c.pedido.aguardando_humano!==true},
 ]},

{id:'l2',grupo:'Dados da loja',nome:'Pagamento e troca',
 esp:'Usa as regras cadastradas, sem inventar',
 msgs:['oi','aceita cartão? parcela?','posso trocar depois?'],

/* Envia e devolve o resultado REAL. fetch nao da erro em 404, entao olhamos
   o status; e erro de rede/CORS cai no catch. Nada de falha silenciosa. */
async function enviar(de,txt,i){
  try{
    const r=await fetch(WH,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload(de,txt,i))});
    if(r.status>=200&&r.status<300)return{ok:true,status:r.status};
    return{ok:false,motivo:'HTTP '+r.status+(r.status===404?' (caminho do webhook não existe ou workflow inativo)':'')};
  }catch(e){
    return{ok:false,motivo:'o navegador não conseguiu enviar ('+(e.message||e)+') — provável bloqueio de CORS ou rede'};
  }
}

const norm=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
const chave=m=>m.id!=null?String(m.id):(m.criado_em+'|'+(m.texto||''));

/* {{codigo}} / {{codigo:tipo}} vira o #NNN de uma foto que a Sofia JÁ mostrou.
   É o que permite escolher um produto de verdade, como a cliente faz. */
function parseLote(imgs){
  return imgs.map(m=>{
    const t=String(m.texto||'');
    const cod=(t.match(/#\s*(\d{1,4})/)||[])[1];
    const tipo=norm((t.split('\n')[0]||'').split('·')[0]);
    let estoque=99;                                   // sem aviso na legenda = mais de 3
    if(/[úu]ltima unidade/i.test(t))estoque=1;
    const mm=t.match(/[úu]ltimas\s+(\d+)\s+unidades/i); if(mm)estoque=parseInt(mm[1],10);
    return cod?{tipo,codigo:'#'+String(cod).padStart(3,'0'),estoque}:null;
  }).filter(Boolean);
}
/* {{codigo}} · {{codigo:tipo}} · {{codigo:tipo:2+}} (mínimo de unidades em estoque).
   Procura primeiro na busca mais recente, depois nas anteriores: a cliente pode
   escolher uma peça que já apareceu antes. */
function resolver(msg,lote){
  const m=String(msg).match(/\{\{codigo(?::([^:}]+))?(?::(\d+)\+)?\}\}/);
  if(!m)return{ok:true,txt:msg};
  const alvo=m[1]?norm(m[1]):null, minimo=m[2]?parseInt(m[2],10):1;
  const achado=lote.find(p=>(!alvo||p.tipo.startsWith(alvo))&&p.estoque>=minimo);
  if(!achado)return{ok:false,falta:(m[1]?('um(a) '+m[1]):'um produto')+(minimo>1?(' com '+minimo+'+ unidades em estoque'):'')};
  return{ok:true,txt:String(msg).replace(m[0],achado.codigo)};
}
function rotulo(m){
  if(m.de==='cliente')return 'Cliente';
  if(m.de==='lab')return 'Laboratório';
  return 'Sofia'+(m.tipo==='imagem'?' · foto':'')+(m.lat?(' · '+Math.round(m.lat/1000)+'s'):'');
}
function rotuloMd(m){
  if(m.de==='cliente')return '**Cliente:** ';
  if(m.de==='lab')return '_Laboratório:_ ';
  return '**Sofia'+(m.tipo==='imagem'?' (foto)':'')+(m.lat?(' ['+Math.round(m.lat/1000)+'s]'):'')+':** ';
}

async function rodar(){
  el('bt-run').disabled=true; RESULT=[]; el('c-res').style.display='none';
  const alvo=CENARIOS.filter(c=>SEL.has(c.grupo));
  // telefone único por rodada e por cenário; 11 dígitos de propósito (a Meta recusa, ninguém real recebe)
  const base=Math.floor(Date.now()/1000)%100000;
  for(let k=0;k<alvo.length;k++){
    const c=alvo[k], de='5531'+String(base*100+k).padStart(7,'0').slice(-7);
    const troca=[], marcos=[], avisos=[], usados=new Set();
    let lote=[], pularNumeros=false;
    for(let i=0;i<c.msgs.length;i++){
      const ehNumero=/^\d+$/.test(String(c.msgs[i]).trim());
      if(pularNumeros&&ehNumero){
        troca.push({de:'lab',txt:'(passo ignorado: "'+c.msgs[i]+'" dependia de uma escolha que não foi feita)',sis:true});
        marcos.push(troca.length);
        continue;
      }
      if(!ehNumero)pularNumeros=false;
      const rs=resolver(c.msgs[i],lote);
      if(!rs.ok){
        pularNumeros=true;
        avisos.push('a busca anterior não trouxe '+rs.falta+'; passo "'+c.msgs[i]+'" não foi enviado');
        troca.push({de:'lab',txt:'(passo ignorado: não havia '+rs.falta+' nos resultados da busca)',sis:true});
        marcos.push(troca.length);
        continue;
      }
      const txt=rs.txt, t0=Date.now();
      const envio=await enviar(de,txt,i);
      troca.push({de:'cliente',txt});
      if(!envio.ok){
        el('lg').textContent='ERRO ao enviar: '+envio.motivo;
        if(RESULT.length===0&&i===0){
          alert('Não consegui entregar a mensagem ao n8n.\n\n'+envio.motivo+'\n\nA rodada foi interrompida.');
          el('bt-run').disabled=false; return;
        }
        troca.push({de:'lab',txt:'(a mensagem não chegou ao n8n: '+envio.motivo+')',sis:true});
        avisos.push('mensagem "'+txt.slice(0,30)+'" não chegou ao n8n');
        marcos.push(troca.length);
        continue;
      }
      el('lg').textContent=`[${k+1}/${alvo.length}] ${c.nome} · ${i+1}/${c.msgs.length}`;
      // silêncio esperado (ex.: depois do handoff): janela curta e sem aviso do laboratório
      const silencio=c.silencioDe!=null&&i>=c.silencioDe;
      const r=await esperar(de,t0,usados,silencio?{semResposta:15000,total:20000}:{});
      marcos.push(troca.length);
      r.msgs.forEach((m,j)=>troca.push({de:'sofia',txt:m.texto,tipo:m.tipo,lat:j===0?r.lat:null}));
      const imgs=r.msgs.filter(m=>m.tipo==='imagem');
      if(imgs.length)lote=parseLote(imgs).concat(lote);
      if(!r.msgs.length&&silencio){
        troca.push({de:'lab',txt:'(silêncio, como esperado)',sis:true});
      }else if(!r.msgs.length){
        troca.push({de:'lab',txt:'(sem resposta em '+Math.round(r.espera/1000)+'s)',sis:true});
        avisos.push('sem resposta para "'+txt.slice(0,30)+'" em '+Math.round(r.espera/1000)+'s');
      }else if(!silencio&&r.lat>20000){
        avisos.push('resposta lenta ('+Math.round(r.lat/1000)+'s) para "'+txt.slice(0,30)+'"');
      }
      await sleep(1200);
    }
    const ctx=await montarCtx(de,troca,marcos);
    const res=c.asserts.map(a=>{let ok=false,err=null;try{ok=!!a.f(ctx);}catch(e){err=String(e.message||e);}return{...a,ok,err};});
    RESULT.push({...c,telefone:de,troca,res,avisos});
    render();
  }
  el('lg').textContent='concluído';
  el('bt-run').disabled=false; el('c-res').style.display='block'; gerar();
}

/* Lê as respostas direto do banco — por isso não precisamos do WhatsApp */
/* Espera a Sofia TERMINAR, não um tempo fixo.
   - sem resposta nenhuma: até 90s (antes eram 24s e a resposta atrasada caía na mensagem errada)
   - depois da primeira resposta: espera silêncio; mais longo quando ela anunciou fotos
     (entre o texto e a primeira foto há pausa de ~3,5s de propósito)
   - cada mensagem da Sofia só é atribuída uma vez ('usados') */
async function esperar(de,desde,usados,opt){
  opt=opt||{};
  const iso=new Date(desde-1200).toISOString();
  const SEM_RESPOSTA=opt.semResposta||90000, TOTAL=opt.total||150000;
  const inicio=Date.now();
  let achadas=[], ultimoNovo=Date.now(), lat=null;
  while(true){
    await sleep(1500);
    const agora=Date.now();
    const rows=(await sbGet('mensagens_wpp','loja_id=eq.'+LOJA+'&telefone=eq.'+de+
      '&direcao=eq.out&criado_em=gte.'+encodeURIComponent(iso)+'&order=criado_em.asc&limit=40'))
      .filter(m=>!usados.has(chave(m)));
    if(rows.length>achadas.length){achadas=rows;ultimoNovo=agora;if(lat===null)lat=agora-desde;}
    if(!achadas.length&&agora-inicio>SEM_RESPOSTA)break;
    if(achadas.length){
      const ult=achadas[achadas.length-1];
      const txt=String(ult.texto||'').toLowerCase();
      const anunciouFotos=ult.tipo!=='imagem'&&/(👇|fotos|te mando|vou mostrar|te mostrar)/.test(txt);
      const quieto=ult.tipo==='imagem'?7000:(anunciouFotos?13000:4500);
      if(agora-ultimoNovo>quieto)break;
    }
    if(agora-inicio>TOTAL)break;
  }
  achadas.forEach(m=>usados.add(chave(m)));
  return{msgs:achadas.map(m=>({texto:m.texto||'',tipo:m.tipo||'texto'})),lat:lat||0,espera:Date.now()-inicio};
}

/* Contexto das assertivas: texto + ESTADO REAL do banco */
async function montarCtx(de,troca,marcos){
  let pedido=null,carrinho=[];
  try{
    const r=await sbGet('carrinhos_wpp','loja_id=eq.'+LOJA+'&telefone=eq.'+de+'&order=criado_em.desc&limit=1');
    if(r&&r[0]){pedido=r[0];carrinho=Array.isArray(r[0].itens)?r[0].itens:[];}
  }catch(e){}
  const falasObj=troca.filter(m=>m.de==='sofia'&&!m.sis);
  const falas=falasObj.map(m=>(m.txt||'').toLowerCase());
  const sofia=falas.join(' \n ');
  return {
    sofia, falas, ultima:(falasObj.filter(m=>m.tipo!=='imagem').map(m=>(m.txt||'').toLowerCase()).pop()||''),
    fotos:falasObj.filter(m=>m.tipo==='imagem').length,
    fotosDepoisDaMsg:(re)=>{const i=troca.findIndex(m=>m.de==='cliente'&&re.test(m.txt||''));
      if(i<0)return 0;return troca.slice(i).filter(m=>m.de==='sofia'&&m.tipo==='imagem').length;},
    fotosDepoisDe:(n)=>{const idx=marcos[n]!=null?marcos[n]:0;
      return troca.slice(idx).filter(m=>m.de==='sofia'&&m.tipo==='imagem').length;},
    carrinho, carrinhoAberto:(pedido&&pedido.estado==='aberto')?carrinho:[], pedido,
    respostasFinais:(()=>{const iu=troca.map(m=>m.de).lastIndexOf('cliente');return troca.slice(iu+1).filter(m=>m.de==='sofia'&&!m.sis).length;})(),
    fotosTipos:falasObj.filter(m=>m.tipo==='imagem').map(m=>norm(String(m.txt||'').split('\n')[0].split('·')[0])),
    tiposFotosDepoisDaMsg:(re)=>{const i=troca.findIndex(m=>m.de==='cliente'&&re.test(m.txt||''));if(i<0)return [];
      return troca.slice(i).filter(m=>m.de==='sofia'&&m.tipo==='imagem').map(m=>norm(String(m.txt||'').split('\n')[0].split('·')[0]));},
    tem:(re)=>re.test(sofia),
  };
}

function render(){
  const tot=RESULT.reduce((a,c)=>a+c.res.length,0);
  const ok=RESULT.reduce((a,c)=>a+c.res.filter(r=>r.ok).length,0);
  const cf=RESULT.filter(c=>c.res.some(r=>!r.ok)).length;
  const inc=RESULT.filter(c=>(c.avisos||[]).length).length;
  el('sum').innerHTML=`<div><b>${RESULT.length}</b>cenários</div><div><b style="color:var(--ok)">${ok}</b>assertivas ok</div>
    <div><b style="color:var(--bad)">${tot-ok}</b>falharam</div><div><b style="color:var(--warn)">${cf}</b>cenários c/ falha</div><div><b>${inc}</b>com avisos do lab</div>`;
  el('bt-f').textContent=soFalhas?'Mostrar tudo':'Só as falhas';
  const lista=soFalhas?RESULT.filter(c=>c.res.some(r=>!r.ok)):RESULT;
  el('res').innerHTML=lista.map(c=>{
    const falhou=c.res.some(r=>!r.ok);
    return `<div class="cen ${falhou?'falhou':''}">
      <h3>${esc(c.grupo)} › ${esc(c.nome)}</h3>
      <div class="esp">${esc(c.esp)}</div>
      ${c.res.map(r=>`<div class="as ${r.ok?'ok':'no'}"><span class="tp">${r.t}</span><span>${r.ok?'✓':'✗'} ${esc(r.q)}${r.err?' · erro: '+esc(r.err):''}</span></div>`).join('')}
      ${(c.avisos||[]).map(a=>`<div class="as av"><span class="tp">lab</span><span>⚠ ${esc(a)}</span></div>`).join('')}<div style="margin-top:9px">${c.troca.map(m=>`<div class="msg ${m.de==='cliente'?'in':(m.de==='lab'?'lab':'out')}"><span class="who">${rotulo(m)}</span>${esc(m.txt)}</div>`).join('')}</div>
    </div>`;}).join('');
}

function gerar(){
  let t='# Laboratório da Sofia — '+new Date().toLocaleString('pt-BR')+' · '+VERSAO_LAB+'\n\n';
  const tot=RESULT.reduce((a,c)=>a+c.res.length,0);
  const ok=RESULT.reduce((a,c)=>a+c.res.filter(r=>r.ok).length,0);
  t+=`${RESULT.length} cenários · ${ok}/${tot} assertivas passaram\n\n`;
  const falhos=RESULT.filter(c=>c.res.some(r=>!r.ok));
  const _incs=RESULT.filter(c=>(c.avisos||[]).length);
  t+='## Resumo das falhas\n\n';
  if(!falhos.length)t+='Nenhuma falha.\n\n';
  falhos.forEach(c=>{t+=`- **${c.grupo} › ${c.nome}**: `+c.res.filter(r=>!r.ok).map(r=>r.q).join(' · ')+'\n';});
  if(_incs.length){t+='\n## Avisos do laboratório (o cenário pode estar inconclusivo)\n\n';_incs.forEach(c=>{t+='- **'+c.grupo+' › '+c.nome+'**: '+c.avisos.join(' · ')+'\n';});}
  t+='\n---\n\n## Detalhe\n\n';
  RESULT.forEach(c=>{
    const falhou=c.res.some(r=>!r.ok);
    t+=`### ${falhou?'❌':'✅'} ${c.grupo} › ${c.nome}\n*Esperado: ${c.esp}*\n\n`;
    (c.avisos||[]).forEach(a=>{t+='- ⚠ [lab] '+a+'\n';});c.res.forEach(r=>{t+=`- ${r.ok?'✓':'✗'} [${r.t}] ${r.q}\n`;});
    t+='\n';
    c.troca.forEach(m=>{t+=rotuloMd(m)+String(m.txt||'').replace(/\n/g,' ')+'\n\n';});
    t+='\n';
  });
  el('rel').value=t;
}
function copiar(){el('rel').select();document.execCommand('copy');alert('Copiado');}
async function limpar(){
  if(!confirm('Cancelar os pedidos criados pelos testes?'))return;
  for(const c of RESULT){
    try{await fetch(SB+'/rest/v1/carrinhos_wpp?loja_id=eq.'+LOJA+'&telefone=eq.'+c.telefone,
      {method:'PATCH',headers:{'apikey':ANON,'Authorization':'Bearer '+TOKEN,'Content-Type':'application/json'},
       body:JSON.stringify({estado:'cancelado'})});}catch(e){}
  }
  alert('Pedidos de teste cancelados.');
}
